apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- rbac.yaml
- manifests.yaml
- service.yaml
- secret.yaml
- deployment.yaml

# Namespace admission webhooks are intentionally not installed by default.
# Opt-in overlays must add namespace_webhooks.yaml and matching cert-rotation
# flags for the namespace webhook configuration names.
#
# Namespace deletion protection via ValidatingAdmissionPolicy (K8s >= 1.30) is
# likewise opt-in: overlays add namespace_deletion_protection_vap.yaml. The
# namespace validating webhook enforces the same rules as fallback when the
# cluster has no VAP support.
#
# Creator tracking via MutatingAdmissionPolicy is also opt-in: overlays add
# creator_tracking_map.yaml when creator protection is wanted. The file uses
# stable v1 (K8s >= 1.36) and documents the v1beta1 setup for 1.34 and 1.35.

configurations:
- kustomizeconfig.yaml

# Add the component label to the auto-generated ValidatingWebhookConfiguration
# (manifests.yaml is generated by controller-gen and cannot carry custom labels).
# Use strategic merge patch to preserve existing labels while adding our own.
patches:
- target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration
  patch: |
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: validating-webhook-configuration
      labels:
        authorization.t-caas.telekom.com/component: "webhook"
