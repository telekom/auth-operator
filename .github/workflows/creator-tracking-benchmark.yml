name: Creator tracking benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: Benchmark scope to execute (full is the release matrix)
        required: true
        type: choice
        options:
          - full
          - quick
        default: full
  pull_request:
    paths:
      - .github/workflows/creator-tracking-benchmark.yml
      - hack/benchmark/**
      - docs/examples/creator-tracking-kyverno-*.yaml
      - chart/auth-operator/**
      - versions.env

permissions:
  contents: read

jobs:
  static:
    name: Benchmark lifecycle static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load versions
        run: grep -v '^#' versions.env | grep -v '^$' >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-go-env
        with:
          go-version-file: go.mod
      - run: make benchmark-creator-tracking-static

  benchmark:
    name: Creator tracking benchmark
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load versions
        run: grep -v '^#' versions.env | grep -v '^$' >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-go-env
        with:
          go-version-file: go.mod
          install-kind: 'true'
          kind-version: ${{ env.KIND_VERSION }}
          install-helm: 'true'
          helm-version: ${{ env.HELM_VERSION }}
      - name: Run benchmark in an isolated owned cluster
        env:
          BENCHMARK_QUICK: ${{ github.event_name != 'workflow_dispatch' || inputs.benchmark_mode == 'quick' }}
        run: |
          set +e
          make benchmark-creator-tracking 2>&1 | tee /tmp/creator-tracking-benchmark.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 40 /tmp/creator-tracking-benchmark.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=creator-tracking benchmark failure::$detail"
          fi
          exit "$status"
      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-tracking-benchmark-${{ github.run_id }}
          path: |
            benchmarks/data/
            /tmp/creator-tracking-benchmark.log
          if-no-files-found: ignore
