version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-type: "all"
    # cel-go changed its declared module path from github.com/google/cel-go
    # to cel.dev/cel-go in v0.32.0. Kubernetes and controller-runtime still
    # import the former path, so newer releases cannot be selected here
    # without an upstream import migration.
    ignore:
      - dependency-name: "github.com/google/cel-go"
        versions:
          - ">= 0.32.0"
    cooldown:
      default-days: 3
      semver-major-days: 14
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      testing:
        patterns:
          - "github.com/onsi/*"
          - "github.com/stretchr/testify"
      go-major:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/onsi/*"
          - "github.com/stretchr/testify"
        update-types:
          - "major"
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/onsi/*"
          - "github.com/stretchr/testify"
        update-types:
          - "minor"
          - "patch"
      go-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # GitHub Actions in workflows and in the local composite actions. Dependabot
  # only scans actions referenced directly in each configured directory; the
  # glob covers every composite action under .github/actions/, including new
  # ones. One entry groups an action bumped in several directories into a
  # single PR.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    groups:
      # The golang builder tag must match go.mod's toolchain directive (CI
      # Lint enforces it), so a Go release needs a coordinated change. Keep it
      # out of the other image updates so it cannot hold them back.
      golang-builder:
        patterns:
          - "golang"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Helm Charts (auth-operator chart dependencies)
  - package-ecosystem: "helm"
    directory: "/chart/auth-operator"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "helm"
    labels:
      - "dependencies"
      - "helm"
    groups:
      helm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      helm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
