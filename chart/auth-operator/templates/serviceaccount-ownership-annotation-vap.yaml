{{- /*
Guards the transitional t-caas.telekom.com/inherit-hosting-namespace-ownership
ServiceAccount annotation via ValidatingAdmissionPolicy (Kubernetes >= 1.30).
Only the identities that may change namespace ownership labels
(kubernetes-admin and system:masters) may set, change or remove it. Keep the
CEL in sync with config/webhook/serviceaccount_ownership_annotation_vap.yaml.
*/}}
{{- $mode := .Values.webhookServer.inheritHostingNamespaceOwnershipGuard | default "auto" }}
{{- if not (has $mode (list "auto" "enabled" "disabled")) }}
{{- fail (printf "webhookServer.inheritHostingNamespaceOwnershipGuard must be one of auto, enabled, disabled (got %q)" $mode) }}
{{- end }}
{{- $vapSupported := .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- if or (eq $mode "enabled") (and (eq $mode "auto") $vapSupported) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "auth-operator.fullname" . }}-serviceaccount-ownership-annotation-guard
  labels:
  {{- include "auth-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
        scope: "Namespaced"
  variables:
    - name: key
      expression: "'t-caas.telekom.com/inherit-hosting-namespace-ownership'"
    - name: newAnnotations
      expression: >-
        has(object.metadata.annotations) ? object.metadata.annotations : {}
    - name: oldAnnotations
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}
    - name: changed
      expression: >-
        (variables.key in variables.newAnnotations) != (variables.key in variables.oldAnnotations)
        || (variables.key in variables.newAnnotations
            && variables.newAnnotations[variables.key] != variables.oldAnnotations[variables.key])
    - name: privileged
      expression: >-
        request.userInfo.username == 'kubernetes-admin'
        || 'system:masters' in request.userInfo.groups
  validations:
    - expression: "!variables.changed || variables.privileged"
      messageExpression: >-
        'only kubernetes-admin or system:masters may set, change or remove the '
        + variables.key + ' annotation on ServiceAccounts'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "auth-operator.fullname" . }}-serviceaccount-ownership-annotation-guard
  labels:
  {{- include "auth-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "auth-operator.fullname" . }}-serviceaccount-ownership-annotation-guard
  validationActions: ["Deny"]
{{- end }}
