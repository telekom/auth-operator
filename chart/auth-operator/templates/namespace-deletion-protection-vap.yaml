{{- /*
Namespace deletion protection via ValidatingAdmissionPolicy (Kubernetes >= 1.30).

Primary enforcement path: runs in-process in the API server, before validating
webhooks, and applies to ALL principals including system:masters. The namespace
validating webhook implements the same rules as fallback for clusters without
VAP support — keep the CEL below in sync with
internal/webhook/authorization/namespace_deletion_protection.go.
*/}}
{{- $vapMode := .Values.namespaceDeletionProtection.vap | default "auto" }}
{{- if not (has $vapMode (list "auto" "enabled" "disabled")) }}
{{- fail (printf "namespaceDeletionProtection.vap must be one of auto, enabled, disabled (got %q)" $vapMode) }}
{{- end }}
{{- $vapSupported := .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- if and .Values.namespaceDeletionProtection.enabled (or (eq $vapMode "enabled") (and (eq $vapMode "auto") $vapSupported)) }}
{{- $hardProtected := concat (list "kube-system" "kube-public" "kube-node-lease" "default") .Values.namespaceDeletionProtection.extraProtectedNamespaces }}
{{- $tdgMigration := eq (toString .Values.webhookServer.tdgMigration) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "auth-operator.fullname" . }}-namespace-deletion-protection
  labels:
  {{- include "auth-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
        scope: "Cluster"
  variables:
    # DELETE requests carry the namespace in oldObject; object is null.
    - name: nsLabels
      expression: >-
        has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}
    - name: hardProtected
      expression: >-
        oldObject.metadata.name in [{{ range $i, $n := $hardProtected }}{{ if $i }}, {{ end }}'{{ $n }}'{{ end }}]
    - name: protectedByLabel
      expression: >-
        ('t-caas.telekom.com/owner' in variables.nsLabels && variables.nsLabels['t-caas.telekom.com/owner'] == 'platform')
        {{- if $tdgMigration }}
        || ('schiff.telekom.de/owner' in variables.nsLabels && variables.nsLabels['schiff.telekom.de/owner'] in ['platform', 'schiff'])
        {{- end }}
        || ('t-caas.telekom.com/deletion-protection' in variables.nsLabels && variables.nsLabels['t-caas.telekom.com/deletion-protection'] == 'enabled')
    - name: allowDeletion
      expression: >-
        has(oldObject.metadata.annotations)
        && 't-caas.telekom.com/allow-deletion' in oldObject.metadata.annotations
        && oldObject.metadata.annotations['t-caas.telekom.com/allow-deletion'] == 'true'
  validations:
    # Hard-protected system namespaces: no annotation can unlock them.
    # Message kept in sync with DenialSystemNamespaceDeletionFmt.
    - expression: "!variables.hardProtected"
      messageExpression: >-
        'Namespace ' + oldObject.metadata.name + ' is a protected system namespace and cannot be deleted'
      reason: Forbidden
    # Protected namespaces require the allow-deletion escape hatch.
    # Message kept in sync with DenialProtectedNamespaceDeletionFmt.
    - expression: "!variables.protectedByLabel || variables.allowDeletion"
      messageExpression: >-
        'Namespace ' + oldObject.metadata.name + ' is deletion-protected; annotate it with t-caas.telekom.com/allow-deletion="true" and retry to confirm deletion'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "auth-operator.fullname" . }}-namespace-deletion-protection
  labels:
  {{- include "auth-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "auth-operator.fullname" . }}-namespace-deletion-protection
  validationActions: ["Deny"]
{{- end }}
