#
# Flux tenant-RBAC e2e fixture with ConstrainedImpersonation (KEP-5284) DISABLED.
#
# Backwards-compatibility half of the impersonation matrix. Flux always sets only
# rest.ImpersonationConfig.UserName, so on this API server it takes the legacy
# impersonation filter instead of the constrained one. Both filters append
# system:authenticated to the impersonated identity, so the discovery expectations
# in the suite must hold identically on both. A divergence between this fixture
# and kind-config-single-flux.yaml means an impersonation-path regression, not a
# tenant-RBAC problem.
#
# Run with: make test-e2e-flux-rbac-no-constrained-impersonation
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-operator-e2e-flux-no-ci
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            feature-gates: "ConstrainedImpersonation=false"
            authorization-mode: "Node,RBAC"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
