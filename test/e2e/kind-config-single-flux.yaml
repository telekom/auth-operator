#
# Kind cluster configuration for the Flux tenant-RBAC e2e suite.
#
# This fixture reproduces the TDG t5g production topology: Flux reconciles tenant
# workloads while impersonating a per-tenant m2m ServiceAccount via
# spec.serviceAccountName. The failure it exists to catch is that an impersonated
# identity holding only resource-scoped RBAC cannot perform Kubernetes API
# *discovery*, which surfaces from controller-runtime's lazy RESTMapper as:
#
#   dry-run failed (Forbidden): failed to get server groups: unknown
#
# Discovery normally works only because the built-in system:discovery ClusterRole
# is bound to the system:authenticated group. A namespaced Role cannot carry
# nonResourceURLs at all, so a tenant granted permissions solely through
# namespaced Roles silently depends on that implicit binding.
#
# ConstrainedImpersonation (KEP-5284) is beta and on by default from Kubernetes
# 1.36, so it is pinned explicitly here to keep expectations independent of the
# kindest/node default. The paired fixture
# kind-config-single-flux-no-constrained-impersonation.yaml flips it to false so
# the same specs run on both impersonation code paths.
#
# containerdConfigPatches wires the host-side local registry (started by
# hack/ci/setup-kind-flux.sh) so OCIRepository and HelmRepository sources can be
# served in-cluster. The suite uses OCI artifacts exclusively, never a
# GitRepository, so the tests carry no dependency on an external git host.
#
# Run with: make test-e2e-flux-rbac
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-operator-e2e-flux
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            feature-gates: "ConstrainedImpersonation=true"
            authorization-mode: "Node,RBAC"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
